version: "3.8"

services:
  temporal:
    image: temporalio/auto-setup:1.23
    container_name: temporal-quiz
    environment:
      DB: postgresql
      # Use your NeonDB connection details
      POSTGRES_SEEDS: ${NEON_HOST}
      DB_PORT: ${NEON_PORT:-5432}
      POSTGRES_USER: ${NEON_USER}
      POSTGRES_PWD: ${NEON_PASSWORD}
      POSTGRES_DB: ${NEON_DATABASE:-temporal}
      # For NeonDB, you might need SSL
      POSTGRES_TLS_ENABLED: true
    # Remove depends_on since we're not using local postgres
    ports:
      - "7234:7233" # Temporal Frontend API - changed port to avoid conflicts
      - "8234:8233" # Temporal Web UI - changed port to avoid conflicts
    
  temporal-ui:
    image: temporalio/ui:2.21.3
    container_name: temporal-ui-quiz
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8235
    ports:
      - "8235:8080"
    depends_on:
      - temporal
